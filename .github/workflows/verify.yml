name: Verify research dashboard

on:
  push:
    branches: [main, arena/cd43258e-own5]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, evidence integrity and browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild reviewed register and all pages
        run: |
          python scripts/seed.py
          python scripts/build.py
          git diff --exit-code -- data/research.json index.html pages/
      - name: Test mathematical identities and row/link integrity
        run: |
          python -m unittest discover -s tests -v
          node --check assets/app.js
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Desktop, mobile, CSV and no-JavaScript checks
        run: |
          python -m http.server 3000 --bind 0.0.0.0 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node -e "const net=require('node:net');let n=0;function wait(){const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>{if(++n>50)process.exit(1);setTimeout(wait,100)})};wait()"
          npm run test:browser

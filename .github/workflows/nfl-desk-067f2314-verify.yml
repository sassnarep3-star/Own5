name: Verify nfl-desk-067f2314

on:
  push:
    branches: [main, arena/067f2314-own5]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-desk-067f2314-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desk-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (including fail-closed negative controls)
        run: python3 -m unittest discover -s nfl-desk-067f2314/tests -v
      - name: Desk build and verification
        run: |
          cd nfl-desk-067f2314
          python3 build_desk.py
          python3 verify_desk.py
      - name: Determinism check
        run: |
          cd nfl-desk-067f2314
          python3 build_desk.py
          git diff --exit-code -- nfl-desk-067f2314/
      - name: Upload verified desk for review
        uses: actions/upload-artifact@v4
        with:
          name: nfl-desk-067f2314
          path: nfl-desk-067f2314/

  pages-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: desk-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Wait for a stable GitHub Pages deploy, then check all desk URLs"
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          root="$base/nfl-desk-067f2314/"
          marker="Own5 NFL Line-Origination Dashboard"
          # 1) Wait for a deploy to serve the root desk page (deploy runs after push).
          deploy_ok=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --location "$root" -o /tmp/root.html; then
              if grep -q "$marker" /tmp/root.html; then
                echo "Deploy detected at $root"
                deploy_ok=1
                break
              fi
            fi
            sleep 10
          done
          if [ "$deploy_ok" -ne 1 ]; then
            echo "GitHub Pages deploy for nfl-desk-067f2314 never became ready" >&2
            exit 1
          fi
          # 2) Wait for a STABLE deploy: concurrent merges can trigger overlapping
          #    Pages rebuilds, so retry the full page set until every page passes.
          paths=(
            "/nfl-desk-067f2314/"
            "/nfl-desk-067f2314/schedule.html"
            "/nfl-desk-067f2314/lines.html"
            "/nfl-desk-067f2314/standings.html"
            "/nfl-desk-067f2314/leaderboard.html"
            "/nfl-desk-067f2314/injuries.html"
            "/nfl-desk-067f2314/gates.html"
            "/nfl-desk-067f2314/snapshots.html"
            "/nfl-desk-067f2314/correlations.html"
            "/nfl-desk-067f2314/results.html"
            "/nfl-desk-067f2314/sources.html"
            "/nfl-desk-067f2314/questions.html"
            "/nfl-desk-067f2314/suggestions.html"
            "/nfl-desk-067f2314/flagged.html"
            "/nfl-desk-067f2314/executive-summary.html"
            "/nfl-desk-067f2314/verification-log.html"
          )
          stable=0
          for sweep in $(seq 1 40); do
            all_ok=1
            failed=""
            for path in "${paths[@]}"; do
              url="$base$path"
              if curl --fail --silent --location "$url" -o /tmp/page.html; then
                if grep -q "$marker" /tmp/page.html; then
                  continue
                fi
              fi
              all_ok=0
              failed="$failed $url"
            done
            if [ "$all_ok" -eq 1 ]; then
              echo "All desk pages verified live (stable deploy)."
              stable=1
              break
            fi
            echo "Sweep $sweep: not yet stable; retrying. Failed:$failed"
            sleep 15
          done
          if [ "$stable" -ne 1 ]; then
            echo "Desk pages never reached a stable deployed state" >&2
            exit 1
          fi

name: diagnose signal board build in CI
on:
  push:
    paths:
      - '.github/workflows/_diag-signal-board.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: python version
        run: python3 -VV
      - name: run the build, then hash every output file
        run: |
          python3 data/nfl-signal-board/build_data.py
          echo "=== STATUS ==="
          git status --porcelain -- data/nfl-signal-board/
          echo "=== PER-FILE HASHES IN CI ==="
          sha256sum data/nfl-signal-board/*.csv data/nfl-signal-board/*.json | sed 's#data/nfl-signal-board/##'

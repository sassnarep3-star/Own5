name: diagnose signal board build in CI
on:
  push:
    paths:
      - '.github/workflows/_diag-signal-board.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run the build and capture the diff
        id: d
        run: |
          python3 -VV > /tmp/out.txt
          python3 data/nfl-signal-board/build_data.py >> /tmp/out.txt 2>&1
          echo "=== STATUS ===" >> /tmp/out.txt
          git -c core.quotepath=false status --porcelain -- data/nfl-signal-board/ >> /tmp/out.txt 2>&1 || true
          echo "=== DIFF STAT ===" >> /tmp/out.txt
          git diff --stat -- data/nfl-signal-board/ >> /tmp/out.txt 2>&1 || true
          echo "=== DIFF ===" >> /tmp/out.txt
          git diff --text -- data/nfl-signal-board/ | head -80 >> /tmp/out.txt 2>&1 || true
          echo "=== ATTRIBUTES CHECK ===" >> /tmp/out.txt
          git check-attr -a data/nfl-signal-board/calibration.csv >> /tmp/out.txt 2>&1 || true
          head -c 3000 /tmp/out.txt > /tmp/short.txt
          echo "snip<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/short.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: post the diff to PR #175
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -Rs '{body: .}' /tmp/short.txt > /tmp/body.json
          gh api -X POST repos/${{ github.repository }}/issues/175/comments --input /tmp/body.json || true

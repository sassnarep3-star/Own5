name: DD probe (temporary)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe nflverse assets
        run: |
          mkdir -p .probe
          for f in injuries/injuries_2026.csv depth_charts/depth_charts_2026.csv snap_counts/snap_counts_2026.csv stats_player/stats_player_reg_2026.csv stats_player/stats_player_week_2026.csv weekly_rosters/roster_weekly_2026.csv; do
            out=".probe/$(basename $f)"
            code=$(curl -sSL -o "$out" -w '%{http_code}' "https://github.com/nflverse/nflverse-data/releases/download/$f" || true)
            echo "ASSET $f http=$code bytes=$(wc -c < "$out" 2>/dev/null || echo 0)"
            head -c 600 "$out" 2>/dev/null; echo; echo "---"
          done
      - name: Probe nfl.com pages
        run: |
          mkdir -p .probe/pages
          for u in "https://www.nfl.com/injuries/" "https://www.nfl.com/schedules/2026/by-week/week-10" "https://www.nfl.com/standings/league/2026/REG"; do
            n=$(echo "$u" | md5sum | cut -c1-8)
            code=$(curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -o ".probe/pages/$n.html" -w '%{http_code}' "$u" || true)
            echo "PAGE $u http=$code bytes=$(wc -c < .probe/pages/$n.html)"
            python3 - "$u" ".probe/pages/$n.html" <<'PY'
import sys,re,json
url,path=sys.argv[1],sys.argv[2]
h=open(path,encoding='utf-8',errors='replace').read()
print('  next_data:', '__NEXT_DATA__' in h, '| ldjson:', h.count('application/ld+json'), '| tables:', h.count('<table'))
m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',h,re.S)
if m:
    try:
        d=json.loads(m.group(1))
        print('  next keys:', list(d.get('props',{}).get('pageProps',{}).keys())[:25])
        s=json.dumps(d.get('props',{}).get('pageProps',{}))[:1200]
        print('  sample:', s)
    except Exception as e:
        print('  next parse err', e)
PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dd-probe
          path: .probe

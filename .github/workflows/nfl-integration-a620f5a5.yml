name: NFL portfolio integration

on:
  push:
    branches: [main, arena/a620f5a5-own5]
    paths:
      - "README.md"
      - "_config.yml"
      - "index.html"
      - "scripts/build.py"
      - "nfl-integration-a620f5a5/**"
      - ".github/workflows/nfl-integration-a620f5a5.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "_config.yml"
      - "index.html"
      - "scripts/build.py"
      - "nfl-integration-a620f5a5/**"
      - ".github/workflows/nfl-integration-a620f5a5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-integration-a620f5a5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the original root proposal site
        run: python3 scripts/build.py
      - name: Build the integration hub
        run: python3 nfl-integration-a620f5a5/build_site.py
      - name: Verify hub source registers, table-row provenance, and local links
        run: python3 nfl-integration-a620f5a5/verify.py
      - name: Re-verify the official evidence, market, standings and schedule desks
        run: |
          python3 nfl-desk-e46fb855/verify.py
          python3 -m unittest discover -s nfl-desk-e46fb855/tests -v
          python3 nfl-market-desk/verify.py
          python3 nfl-market-desk/tests/test_market_desk.py
          python3 nfl-desk-e1d60f5d/verify.py
          python3 -m unittest discover -s nfl-desk-e1d60f5d/tests -v
      - name: Re-run the independent Week 10 injury and transaction audit
        run: |
          python3 nfl-audit-a699fc53/build.py
          python3 -m unittest discover -s nfl-audit-a699fc53/tests -v
      - name: Rebuild the independent Week 10 injury capture and run its hard checks
        run: python3 nfl-capture-a991e3fb/build.py
      - name: Check generated pages and whitespace are clean
        run: |
          git diff --check
          git diff --exit-code -- index.html nfl-integration-a620f5a5 nfl-audit-a699fc53 nfl-desk-e1d60f5d nfl-desk-e46fb855 nfl-market-desk nfl-capture-a991e3fb

  pages-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the root and integration hub are published on GitHub Pages
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          base="https://${REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}"
          for path in "/" "/nfl-integration-a620f5a5/" "/nfl-integration-a620f5a5/flagged.html"; do
            url="$base$path"
            success=0
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --location "$url" | grep -q 'NFL'; then
                echo "OK $url"
                success=1
                break
              fi
              sleep 10
            done
            if [ "$success" -ne 1 ]; then
              echo "Published page did not become ready: $url" >&2
              exit 1
            fi
          done

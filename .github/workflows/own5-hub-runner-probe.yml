name: Own5 hub - runner reachability probe (manual)

# Manual diagnostic only. Answers one question that earlier desks assumed without testing:
# can a GitHub-hosted runner fetch the league's official injury report and standings pages?
# It stores nothing in the repository; the result is read from the run log.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch official pages and report status, size and sha256
        run: |
          for url in "https://www.nfl.com/injuries/" "https://www.nfl.com/standings/league/2026/REG" "https://www.nfl.com/transactions/league/reserve-list/2026/11"; do
            tmp=$(mktemp)
            code=$(curl --silent --show-error --location --max-time 60 -o "$tmp" -w '%{http_code}' "$url" || echo "curl-failed")
            bytes=$(stat -c %s "$tmp" 2>/dev/null || echo 0)
            sha=$(sha256sum "$tmp" 2>/dev/null | cut -d' ' -f1)
            fetched=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "PROBE $fetched http=$code bytes=$bytes sha256=$sha url=$url"
            echo "--- first 300 bytes of body ---"
            head -c 300 "$tmp" | tr -cd '[:print:]\n' || true
            echo
          done

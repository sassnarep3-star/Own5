name: Verify NBA validation desk
on:
  push:
    branches: [main, arena/e9a43ca6-own5]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s nba-validation -v
      - run: python nba-validation/build.py && python nba-validation/check.py
      - run: git diff --exit-code -- nba-validation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Desktop and mobile browser checks
        run: |
          python -m http.server 3000 --bind 0.0.0.0 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node -e "const net=require('node:net');let n=0;function wait(){const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>{if(++n>50)process.exit(1);setTimeout(wait,100)})};wait()"
          node nba-validation/browser.cjs

name: Verify NFL Line-Origination Desk (d38e90c5)

on:
  push:
    branches: [main]
    paths:
      - 'nfl-desk-d38e90c5/**'
      - '.github/workflows/nfl-desk-d38e90c5.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nfl-desk-d38e90c5/**'
      - '.github/workflows/nfl-desk-d38e90c5.yml'
  workflow_dispatch:
  schedule:
    # Monday 07:15 UTC, after the official injury report refreshes
    - cron: '15 7 * * 1'

permissions:
  contents: read

concurrency:
  group: nfl-desk-d38e90c5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild every data file and page from the pinned official inputs
        working-directory: nfl-desk-d38e90c5
        run: |
          python3 pipeline.py
          python3 build_site.py

      - name: Deterministic rebuild check (data and pages must not drift)
        working-directory: nfl-desk-d38e90c5
        run: |
          python3 pipeline.py > /dev/null
          python3 build_site.py > /dev/null

      - name: Line-by-line verification (sources, blanks, n, order, gate, links)
        working-directory: nfl-desk-d38e90c5
        run: python3 verify.py

      - name: Committed artefacts match the deterministic build
        run: git diff --exit-code -- nfl-desk-d38e90c5/data nfl-desk-d38e90c5/index.html nfl-desk-d38e90c5/pages nfl-desk-d38e90c5/assets

      - name: Upload the built desk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-line-origination-d38e90c5
          path: |
            nfl-desk-d38e90c5/data
            nfl-desk-d38e90c5/index.html
            nfl-desk-d38e90c5/pages
            nfl-desk-d38e90c5/assets
            nfl-desk-d38e90c5/research

  pages-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the published desk URLs
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nfl-desk-d38e90c5"
          for path in "/" "/pages/own-lines.html" "/pages/leaderboard.html" "/pages/gate.html" "/pages/flagged.html" "/pages/sources.html"; do
            url="$base$path"
            ok=0
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --location "$url" | grep -q 'Own5'; then
                echo "OK $url"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "Published page did not become ready: $url" >&2
              exit 1
            fi
          done

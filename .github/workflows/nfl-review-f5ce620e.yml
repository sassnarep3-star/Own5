name: Verify NFL decision-readiness review (f5ce620e)

on:
  push:
    branches: [main, arena/f5ce620e-own5]
    paths:
      - 'nfl-review-f5ce620e/**'
      - '.github/workflows/nfl-review-f5ce620e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nfl-review-f5ce620e/**'
      - '.github/workflows/nfl-review-f5ce620e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-review-f5ce620e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Source links, audit invariants, tests and determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check deterministic committed pages and manifest
        run: |
          python3 nfl-review-f5ce620e/build.py --check
          python3 nfl-review-f5ce620e/build.py --check
      - name: Verify sources, row-level provenance, internal links and audit gates
        run: python3 nfl-review-f5ce620e/verify.py
      - name: Run scoped regression tests
        run: python3 -m unittest discover -s nfl-review-f5ce620e/tests -v
      - name: Require committed artifacts to remain unchanged
        run: git diff --exit-code -- nfl-review-f5ce620e/

  pages-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify published review pages after the main-branch Pages update
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          for spec in \
            '/nfl-review-f5ce620e/|Independent NFL decision-readiness review' \
            '/nfl-review-f5ce620e/audit.html|Audit findings' \
            '/nfl-review-f5ce620e/flagged.html|Flagged for Review' \
            '/nfl-review-f5ce620e/sources.html|Week 11 venue labels'; do
            path="${spec%%|*}"
            needle="${spec#*|}"
            ready=0
            for attempt in $(seq 1 24); do
              if body="$(curl --fail --silent --show-error --location "$BASE_URL$path")" && grep -Fq "$needle" <<< "$body"; then
                echo "OK $BASE_URL$path"
                ready=1
                break
              fi
              sleep 10
            done
            if [ "$ready" -ne 1 ]; then
              echo "Published page did not become ready: $BASE_URL$path" >&2
              exit 1
            fi
          done

name: Verify and publish dashboard

on:
  push:
    branches: [main, arena/e0e66278-own5]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify deterministic data and site rebuild
        run: |
          find data dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/own5-first.sha256
          npm run build
          find data dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/own5-second.sha256
          diff -u /tmp/own5-first.sha256 /tmp/own5-second.sha256
      - name: Upload verified site for review
        uses: actions/upload-artifact@v4
        with:
          name: verified-dashboard
          path: dist/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check published landing page
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location "$url" | grep -q 'Own5'; then
              echo "Published dashboard responded successfully: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Published dashboard did not become ready" >&2
          exit 1

name: NFL Decision Desk — fetch & verify
on:
  push:
    branches: [main, arena/38a1fc27-own5]
    paths: ['data/decision-desk/TRIGGER']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decision-desk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official + aggregator inputs (provenance recorded)
        run: python3 tools/decision_desk/fetch_sources.py
      - name: Upload official HTML snapshots (inspection artifact, not committed)
        uses: actions/upload-artifact@v4
        with:
          name: official-html
          path: .work/official/
          if-no-files-found: warn
      - name: Commit pinned snapshot
        run: |
          git config user.name "decision-desk-bot"
          git config user.email "decision-desk-bot@users.noreply.github.com"
          git add data/decision-desk/raw
          if git diff --cached --quiet; then
            echo "no snapshot change"
          else
            git commit -m "data(decision-desk): pinned official+nflverse snapshot [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
